version: 2

builds:
  - id: sshc
    main: ./cmd/sshc
    binary: sshc
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: sshdc
    main: ./cmd/sshdc
    binary: sshdc
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt
